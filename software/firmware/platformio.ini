[platformio]
default_envs = black_f407zg
; 工程位于中文路径（D:\AI项目总库\...），arm-none-eabi-ld 无法创建含 CJK 的
; firmware.map，链接会报 “cannot open map file”。把构建目录放到纯 ASCII 路径即可，
; 源码路径不需要改。构建产物：%USERPROFILE%\.platformio\build\pinghengche\
build_dir = ${sysenv.USERPROFILE}/.platformio/build/pinghengche

[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = arduino

upload_protocol = stlink
debug_tool = stlink

lib_deps =
    sparkfun/SparkFun BMI270 Arduino Library@1.0.3
    teemuatlut/TMCStepper@^0.7.3
