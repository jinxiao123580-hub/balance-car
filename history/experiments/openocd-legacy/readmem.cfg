# openocd dump u32 raw - simple
source [find interface/stlink.cfg]
source [find target/stm32f4x.cfg]
init
halt
puts "RAW pitch=[mdw 0x20000828]"
puts "RAW accPitch=[mdw 0x2000082c]"
puts "RAW kalmanAngle=[mdw 0x2000081c]"
puts "RAW gyroPitchRate=[mdw 0x20000824]"
puts "RAW balanceAngleOffset=[mdw 0x20000120]"
puts "RAW targetBalanceAngle=[mdw 0x200000b8]"
flush stdout
shutdown