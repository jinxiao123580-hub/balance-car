# verify PB10 (USART3_TX) is actually toggling - read GPIOB IDR (input data reg) multiple times
source [find interface/stlink.cfg]
source [find target/stm32f4x.cfg]
init
halt
# GPIOB IDR = 0x40020410
puts "IDR1=[mdw 0x40020410]"
puts "IDR2=[mdw 0x40020410]"
puts "IDR3=[mdw 0x40020410]"
puts "USART3_DR=[mdw 0x40004804]"
flush stdout
shutdown