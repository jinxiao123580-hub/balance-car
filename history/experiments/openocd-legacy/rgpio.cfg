# USART3 base = 0x40004800. SR=+0x00, BRR=+0x08, CR1=+0x0C
source [find interface/stlink.cfg]
source [find target/stm32f4x.cfg]
init
halt
puts "MODER_B=[mdw 0x40020400]"
puts "AFRH_B=[mdw 0x40020424]"
puts "USART3_SR=[mdw 0x40004800]"
puts "USART3_BRR=[mdw 0x40004808]"
puts "USART3_CR1=[mdw 0x4000480c]"
flush stdout
shutdown