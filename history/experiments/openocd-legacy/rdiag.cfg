# openocd live diag - read PC + key vars to see if main loop is running
source [find interface/stlink.cfg]
source [find target/stm32f4x.cfg]
init
halt
puts "PC=[reg pc]"
puts "SP=[reg sp]"
puts "RAW_divider=[mdw 0x200007e8]"
puts "RAW_pitch=[mdw 0x20000828]"
puts "RAW_gyro=[mdw 0x20000824]"
puts "RAW_m1=[mdw 0x2000089c]"
puts "RAW_m2=[mdw 0x20000898]"
puts "RAW_txHead=[mdw 0x200007f0]"
puts "RAW_loopAddr=[expr 0x0800756c]"
puts "RAW_setupAddr=[expr 0x08007388]"
flush stdout
shutdown